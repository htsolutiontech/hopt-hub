<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B3C5D">
<title>HOPT Intelligence Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B3C5D;--navy-2:#0F4C75;--teal:#1D7874;--orange:#E07A1F;--orange-50:#FDF1E6;
  --red:#C2410C;--red-50:#FDECEC;--green:#15803D;--green-50:#E8F5EC;--ink:#1F2933;--mute:#64748B;--line:#E2E8F0;
  --bg:#F4F7FA;--card:#FFFFFF;--shadow:0 1px 2px rgba(15,40,70,.06),0 4px 16px rgba(15,40,70,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--navy-2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.top{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 60%,var(--teal) 100%);color:#fff;padding:18px 24px 64px}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.25);flex:none}
.brand h1{margin:0;font-size:20px;font-weight:700}
.brand p{margin:0;font-size:12.5px;opacity:.8}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:#fff}
button.chip{cursor:pointer}button.chip:hover{background:rgba(255,255,255,.2)}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600;opacity:.7}
.lang button[aria-pressed=true]{background:rgba(255,255,255,.22);opacity:1}
.dot{width:8px;height:8px;border-radius:50%;background:#94A3B8;flex:none}.dot.live{background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}.dot.warn{background:#FBBF24}
main{max-width:1240px;margin:-44px auto 0;padding:0 20px 40px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.kpi .l{color:var(--mute);font-size:12.5px;margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab{padding:10px 16px;border:0;background:none;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--navy);border-color:var(--teal)}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.grid.one{grid-template-columns:1fr}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;gap:12px;align-items:flex-start}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;color:#fff}
.card-h h3{margin:0;font-size:15.5px;line-height:1.3}
.card-h .meta{color:var(--mute);font-size:12px;margin-top:2px}
.pill{margin-left:auto;flex:none;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--green-50);color:var(--green)}.p-err{background:var(--red-50);color:var(--red)}.p-wait{background:#F1F5F9;color:var(--mute)}.p-old{background:var(--orange-50);color:var(--orange)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.mini b{display:block;font-size:16px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini span{font-size:11px;color:var(--mute);display:block;line-height:1.3}
.hl{margin:0;padding-left:18px}.hl li{margin:3px 0}
.empty{color:var(--mute);font-size:13px;background:#F8FAFC;border:1px dashed var(--line);border-radius:10px;padding:12px}
.foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto;color:var(--mute)}
.flag{display:inline-flex;gap:5px;align-items:center}
.flag i{width:7px;height:7px;border-radius:50%;display:inline-block;background:#CBD5E1}.flag i.g{background:var(--green)}.flag i.r{background:var(--red)}
.sec{margin-top:22px}.sec h2{font-size:16px;margin:0 0 10px;color:var(--navy)}.sec .sub{color:var(--mute);font-size:12.5px;margin:-6px 0 12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:13px;min-width:560px}
th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:9px 12px;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
.conf{border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600}
.c-Cao{background:var(--green-50);color:var(--green)}.c-Vừa{background:var(--orange-50);color:var(--orange)}.c-Thấp{background:#F1F5F9;color:var(--mute)}
.heat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;overflow-x:auto}
.hm{display:grid;gap:4px;align-items:center;min-width:620px}
.hm .lab{font-size:12px;color:var(--mute);white-space:nowrap;padding-right:8px}.hm .d{font-size:10.5px;color:var(--mute);text-align:center}
.cell{height:22px;border-radius:5px;background:#EEF2F6}.cell.ok{background:var(--teal)}.cell.err{background:var(--red)}.cell.part{background:var(--orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.banner{background:var(--orange-50);color:#7C3E06;border:1px solid #F6D2AE;border-radius:10px;padding:10px 14px;margin-top:14px;font-size:13px;display:none}
/* login */
.login{position:fixed;inset:0;background:rgba(11,60,93,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.login.on{display:flex}
.lbox{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:420px;padding:26px 24px}
.lbox h2{margin:0 0 4px;color:var(--navy);font-size:20px}.lbox p{margin:0 0 16px;color:var(--mute);font-size:13px}
.lbox label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 6px}
.lbox select,.lbox input{width:100%;padding:11px 12px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;font-size:15px;background:#fff}
.lbox select:focus,.lbox input:focus{outline:2px solid var(--teal);border-color:transparent}
.lbtn{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.lbtn[disabled]{opacity:.6;cursor:wait}
.lerr{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.lnote{font-size:11.5px;color:var(--mute);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.llang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
.llang button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.llang button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
footer{max-width:1240px;margin:0 auto;padding:18px 20px 30px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.minis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.top{padding:14px 14px 58px}.brand h1{font-size:17px}.brand p{display:none}.top-right{margin-left:0;width:100%}
  .chip{padding:5px 10px;font-size:11.5px}#nextRun{display:none}main{padding:0 12px 32px}.kpi{padding:12px 14px}.kpi .v{font-size:23px}.kpi .s{display:none}
  .card{padding:15px}.tab{padding:10px 12px}footer{padding:16px 12px 26px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark">HOPT</div>
      <div><h1>HOPT Intelligence Hub</h1><p data-i="tagline"></p></div>
    </div>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Language"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
      <div class="chip"><span class="dot" id="connDot"></span><span id="connTxt"></span></div>
      <div class="chip mono" id="clock">--:--</div>
      <div class="chip" id="nextRun"></div>
      <button class="chip" id="userChip" style="display:none"></button>
    </div>
  </div>
</header>

<main>
  <section class="kpis">
    <div class="kpi"><div class="v" id="kReported">–</div><div class="l" data-i="kReported"></div><div class="s" data-i="kReportedS"></div></div>
    <div class="kpi"><div class="v" id="kEmail">–</div><div class="l" data-i="kEmail"></div><div class="s" data-i="kEmailS"></div></div>
    <div class="kpi"><div class="v" id="kAttach">–</div><div class="l" data-i="kAttach"></div><div class="s" data-i="kAttachS"></div></div>
    <div class="kpi"><div class="v" id="kErr">–</div><div class="l" data-i="kErr"></div><div class="s" id="kErrS"></div></div>
  </section>
  <div class="banner" id="banner"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="today" data-i="tToday"></button>
    <button class="tab" role="tab" data-v="week" data-i="tWeek"></button>
    <button class="tab" role="tab" data-v="year" data-i="tYear"></button>
    <button class="tab" role="tab" data-v="log" data-i="tLog"></button>
  </nav>

  <section class="view" id="v-today">
    <div class="grid" id="todayGrid"></div>
    <div class="sec" id="recoSec">
      <h2 data-i="recoH"></h2>
      <p class="sub" id="recoSub"></p>
      <div id="recoBox"></div>
    </div>
  </section>
  <section class="view" id="v-week"><div class="grid" id="weekGrid"></div></section>
  <section class="view" id="v-year"><div class="grid" id="yearGrid"></div></section>
  <section class="view" id="v-log">
    <div class="sec" style="margin-top:0"><h2 data-i="logH14"></h2>
      <div class="heat"><div class="hm" id="heat"></div>
        <div class="legend"><span><i style="background:var(--teal)"></i><b data-i="lgOk" style="font-weight:400"></b></span><span><i style="background:var(--orange)"></i><b data-i="lgPart" style="font-weight:400"></b></span><span><i style="background:var(--red)"></i><b data-i="lgErr" style="font-weight:400"></b></span><span><i style="background:#EEF2F6"></i><b data-i="lgNone" style="font-weight:400"></b></span></div>
      </div></div>
    <div class="sec"><h2 data-i="logRecent"></h2><div id="logTable"></div></div>
  </section>
</main>

<footer>
  <span><span data-i="design"></span>: <a href="https://htsolutiontech.github.io/AIConsulting/">Mr Thuong AgenticAI</a></span>
  <span data-i="footNote"></span>
</footer>

<div class="login" id="login" role="dialog" aria-modal="true" aria-labelledby="lTitle">
  <form class="lbox" id="lform" autocomplete="on">
    <div class="llang"><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div>
    <h2 id="lTitle" data-i="lTitle"></h2>
    <p data-i="lSub"></p>
    <label for="lRole" data-i="lRole"></label>
    <select id="lRole" name="username" autocomplete="username"></select>
    <label for="lPw" data-i="lPw"></label>
    <input id="lPw" type="password" name="password" autocomplete="current-password" required minlength="8">
    <button class="lbtn" id="lBtn" type="submit" data-i="lBtn"></button>
    <div class="lerr" id="lErr" role="alert"></div>
    <div class="lnote" data-i="lNote"></div>
  </form>
</div>

  // ================= crypto (WebCrypto) =================
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function openPrivate(role, password){
    const e = KEYS.roles[role].encPriv;
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const aes = await crypto.subtle.deriveKey({name:"PBKDF2", salt:ub64(e.salt), iterations:e.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pkcs8 = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(e.iv)}, aes, ub64(e.ct));
    return crypto.subtle.importKey("pkcs8", pkcs8, {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]);
  }
  async function decryptAll(doc){
    const out = [];
    for (const [g, b] of Object.entries((doc && doc.bundles) || {})){
      const wrapped = b.keys && b.keys[ROLE]; if (!wrapped) continue;
      try {
        const raw = await crypto.subtle.decrypt({name:"RSA-OAEP"}, PRIV, ub64(wrapped));
        const k = await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["decrypt"]);
        const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(b.iv), additionalData:new TextEncoder().encode(g)}, k, ub64(b.ct));
        arr(JSON.parse(new TextDecoder().decode(pt)).runs).forEach(r => { if (r && r.agent === g) out.push(r); });
      } catch(e){ /* bundle not readable by this role */ }
    }
    return out.sort((x,y) => String(y.finishedAt||"").localeCompare(String(x.finishedAt||"")));
  }

    try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch(e){ db = null; }

    // claude.ai: only the owner can open this artifact -> full view, data straight from the Hub store
    MODE = "db"; ROLE = "owner"; ALLOWED = new Set(["A1","A2","A3","A4","W","Y"]); userChip(); show();
    const timer = setTimeout(() => { setConn("warn","connWait"); banner("bTimeout"); }, 10000);
    db.collection("runs").orderBy("finishedAt","desc").limit(300).onSnapshot(snap => {
      if (!snap.metadata.fromCache){ clearTimeout(timer); banner(null); }
      RUNS = snap.docs.map(d => ({id:d.id, ...(d.data()||{})})).filter(r => r && typeof r.agent === "string");
      setConn("live", snap.metadata.fromCache ? "connSync" : "connLive", {n:RUNS.length}); render();
    }, err => { clearTimeout(timer); setConn("warn","connNo"); banner("bLost",{c:(err && err.code) || "error"}); });
  })();
})();
</script>
